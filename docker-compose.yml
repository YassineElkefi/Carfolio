
services:
  postgres:
    image: postgres:17
    container_name: carfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carfolio
      POSTGRES_USER: carfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carfolio -d carfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carfolio_postgres_data:
